name: marp-to-pages
concurrency:
  group: marp-to-pages
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli@4.4.0

      - name: Ensure build dir exists
        run: mkdir -p build

      - name: Copy presentation assets
        run: |
          for dir in */; do
            dir="${dir%/}"
            if [[ -f "$dir/slides.md" ]]; then
              mkdir -p "build/$dir"
              find "$dir" -not -name "slides.md" -type f | while read f; do
                dest="build/${f}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              done
            fi
          done

      - name: Marp Build (all presentations)
        run: |
          for dir in */; do
            dir="${dir%/}"
            if [[ -f "$dir/slides.md" ]]; then
              marp "$dir/slides.md" --allow-local-files -o "build/$dir/index.html"
            fi
          done

      - name: Add root index
        run: |
          echo "<ul>" > build/index.html
          for dir in */; do
            dir="${dir%/}"
            if [[ -f "$dir/slides.md" ]]; then
              echo "  <li><a href=\"$dir/\">$dir</a></li>" >> build/index.html
            fi
          done
          echo "</ul>" >> build/index.html

      - name: Update README presentation list
        if: ${{ github.event_name == 'push' }}
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})"

          LIST=""
          for dir in */; do
            dir="${dir%/}"
            if [[ -f "$dir/slides.md" ]]; then
              LIST="${LIST}- [${dir}](${REPO_URL}/${dir})\n"
            fi
          done

          python3 - "$LIST" <<'EOF'
          import sys, re, pathlib

          readme = pathlib.Path("README.md")
          content = readme.read_text()
          new_list = sys.argv[1]

          updated = re.sub(
            r'(\[//\]: # \(PRESENTATIONS_START\)).*?(\[//\]: # \(PRESENTATIONS_STOP\))',
            rf'\1\n\n{new_list}\n\2',
            content,
            flags=re.DOTALL
          )

          readme.write_text(updated)
          EOF

      - name: Commit updated README
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update published presentations list [skip ci]"
          git push

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
